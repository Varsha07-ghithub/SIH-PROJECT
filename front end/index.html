========================================================= */

function GISExplorer({setSelectedEvent}){

  useEffect(()=>{

    if(window.__gisMap)
      return;

    setTimeout(()=>{

      const map = L.map("gis-map")
        .setView(
          [13.0827,80.2707],
          9
        );

      window.__gisMap = map;

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution:"© OpenStreetMap"
        }
      ).addTo(map);

      mockEvents.forEach(e=>{

        const marker = L.circleMarker(
          [e.lat,e.lng],
          {
            radius:5,
            color:"#38bdf8",
            fillColor:"#38bdf8",
            fillOpacity:.7
          }
        );

        marker.bindPopup(
          `<b>${e.id}</b><br/>
           ${e.classification}<br/>
           Risk: ${e.risk}`
        );

        marker.addTo(map);

      });

    },100);

  },[]);

  return (

    <div className="page">

      <PageHeader
        title="GIS Explorer"
        description="Multi-layer geospatial intelligence workspace"
      />

      <div
        className="map-wrap"
        style={{
          height:"calc(100% - 70px)"
        }}
      >

        <div id="gis-map"></div>

        <div
          className="map-overlay"
          style={{width:180}}
        >

          <div className="section-heading">
            GIS LAYERS
          </div>

          <div className="factor">
            <span>Thermal Events</span>
            <b>ON</b>
          </div>

          <div className="factor">
            <span>Industrial Facilities</span>
            <b>ON</b>
          </div>

          <div className="factor">
            <span>Risk Zones</span>
            <b>ON</b>
          </div>

          <div className="factor">
            <span>Land Cover</span>
            <b>ON</b>
          </div>

          <div className="factor">
            <span>Historical Events</span>
            <b>ON</b>
          </div>

        </div>

      </div>

    </div>
  );
}

/* =========================================================
   REPORTS
========================================================= */

function Reports({showToast, selectedEvent}){
  const ev = selectedEvent || {
    id: "TF-10293",
    classification: "Industrial Fire",
    confidence: 91.4,
    risk: 87,
    frp: 120,
    temperature: 368,
    satellite: "VIIRS SNPP",
    persistence: "HIGH",
    facility: "Eastern Petro Refinery (Manali)",
    landCover: "Built Area / Industrial",
    lat: 13.15,
    lng: 80.28,
    date: "2026-09-10"
  };

  const exportCSV = () => {
    const data = `Event ID,Latitude,Longitude,Classification,FRP (MW),Brightness (K),Confidence (%),Risk Score,Facility,Land Cover,Date\n${ev.id},${ev.lat},${ev.lng},"${ev.classification}",${ev.frp || 45},${ev.temperature || 335},${ev.confidence || 85},${ev.risk || 70},"${ev.facility || 'N/A'}","${ev.landCover || 'N/A'}",${ev.date || '2026-09-10'}`;
    const blob = new Blob([data], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Incident_Report_${ev.id}.csv`;
    a.click();
    showToast && showToast(`Exported Incident_Report_${ev.id}.csv`);
  };

  const exportGeoJSON = () => {
    const geojson = {
      type: "FeatureCollection",
      features: [{
        type: "Feature",
        geometry: { type: "Point", coordinates: [ev.lng, ev.lat] },
        properties: {
          id: ev.id,
          classification: ev.classification,
          frp: ev.frp || 45,
          brightness: ev.temperature || 335,
          riskScore: ev.risk || 70,
          facility: ev.facility,
          landCover: ev.landCover,
          date: ev.date || "2026-09-10"
        }
      }]
    };
    const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Incident_Report_${ev.id}.geojson`;
    a.click();
    showToast && showToast(`Exported Incident_Report_${ev.id}.geojson`);
  };

  const exportKML = () => {
    const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Placemark>
    <name>${ev.id} - ${ev.classification}</name>
    <description>FRP: ${ev.frp || 45} MW, Risk Score: ${ev.risk || 70}/100, Facility: ${ev.facility || 'N/A'}</description>
    <Point>
      <coordinates>${ev.lng},${ev.lat},0</coordinates>
    </Point>
  </Placemark>
</kml>`;
    const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Incident_Report_${ev.id}.kml`;
    a.click();
    showToast && showToast(`Exported Incident_Report_${ev.id}.kml`);
  };

  return (
    <div className="page">
      <PageHeader
        title="Report Center"
        description="Generate official AI thermal event investigation reports & geospatial exports"
      />

      <div className="card" style={{border: "1px solid rgba(56, 189, 248, 0.3)", boxShadow: "0 8px 32px rgba(0,0,0,0.5)"}}>
        <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,0.08)", paddingBottom: "12px", marginBottom: "16px"}}>
          <div>
            <div style={{fontSize: "10px", color: "#38bdf8", fontWeight: "bold", letterSpacing: "1px"}}>OFFICIAL AI INCIDENT REPORT</div>
            <div style={{fontSize: "20px", fontWeight: "900", color: "#f8fafc"}}>{ev.id} — {ev.classification}</div>
          </div>
          <button
            onClick={() => window.print()}
            style={{
              background: "linear-gradient(135deg, #0284c7, #2563eb)",
              color: "white",
              border: "none",
              borderRadius: "8px",
              padding: "8px 16px",
              fontSize: "12px",
              fontWeight: "bold",
              cursor: "pointer"
            }}
          >
            🖨️ Print / Save PDF
          </button>
        </div>

        <div className="grid" style={{marginBottom: "16px"}}>
          <IntelStat label="EVENT ID" value={ev.id} />
          <IntelStat label="CLASSIFICATION" value={ev.classification} />
          <IntelStat label="AI CONFIDENCE" value={`${(ev.confidence || 91.4).toFixed(1)}%`} />
          <IntelStat label="RISK SCORE" value={`${ev.risk || 87} / 100`} />
          <IntelStat label="FRP INTENSITY" value={`${ev.frp || 120} MW`} />
          <IntelStat label="BRIGHTNESS TEMP" value={`${ev.temperature || 368} K`} />
          <IntelStat label="FACILITY" value={ev.facility || "Industrial Facility"} />
          <IntelStat label="LAND COVER" value={ev.landCover || "Built Area / Industrial"} />
          <IntelStat label="COORDINATES" value={`[${ev.lat.toFixed(4)}, ${ev.lng.toFixed(4)}]`} />
        </div>

        <div className="section" style={{marginBottom: "16px"}}>
          <div className="section-heading">AI MULTI-FACTOR EXPLANATION</div>
          <div className="explanation" style={{lineHeight: "1.6", color: "#cbd5e1"}}>
            High thermal radiative power ({ev.frp || 120} MW) combined with elevated brightness temperature ({ev.temperature || 368} K) and proximity to industrial infrastructure contributed strongly to the classification of <b>{ev.classification}</b>.
          </div>
        </div>

        <div className="section" style={{marginBottom: "18px"}}>
          <div className="section-heading">EMERGENCY INVESTIGATION PRIORITY</div>
          <div style={{fontSize: "22px", fontWeight: "900", color: (ev.risk || 87) >= 80 ? "#ef4444" : "#f97316"}}>
            {(ev.risk || 87) >= 80 ? "🚨 CRITICAL EMERGENCY DISPATCH" : "⚠️ HIGH PRIORITY MONITORING"}
          </div>
        </div>

        <div className="actions" style={{display: "flex", gap: "10px", flexWrap: "wrap"}}>
          <button className="action" style={{background: "linear-gradient(135deg, #059669, #10b981)", color: "white"}} onClick={exportCSV}>
            📥 EXPORT REAL CSV
          </button>
          <button className="action" style={{background: "linear-gradient(135deg, #7c3aed, #6366f1)", color: "white"}} onClick={exportGeoJSON}>
            🌐 EXPORT GEOJSON
          </button>
          <button className="action" style={{background: "linear-gradient(135deg, #d97706, #f59e0b)", color: "white"}} onClick={exportKML}>
            🗺️ EXPORT KML (GOOGLE EARTH)
          </button>
        </div>
      </div>
    </div>
  );
}
